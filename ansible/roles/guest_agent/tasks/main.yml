---
- name: Gather needed facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution_major_version
      - hardware
      - virtualization_role
      - virtualization_type
  when: ansible_facts.distribution_major_version is not defined or
        ansible_facts.system_vendor is not defined or
        ansible_facts.virtualization_role is not defined or
        ansible_facts.virtualization_type is not defined

- name: Remove unneeded firmware packages
  vars:
    firmware_packages:
      - 'a*firmware*'
      - 'b*firmware*'
      - "{{ 'c*firmware*' if ansible_facts.distribution_major_version | int >= 9 else '' }}"
      - 'i*firmware*'
      - 'lib*firmware*'
      - "{{ 'linux-firmware*' if ansible_facts.distribution_major_version | int >= 9 else '' }}"
      - 'm*firmware*'
      - 'n*firmware*'
      - 'r*firmware*'
      - 't*firmware*'
  ansible.builtin.dnf:
    name: "{{ firmware_packages | select }}"
    state: absent
    cacheonly: true
    disablerepo: '*'
  when:
    - ansible_facts.virtualization_role == "guest"
    - guest_agent_remove_firmware | bool

- name: Remove all virtual guest packages
  ansible.builtin.dnf:
    name:
      - 'hyperv*'
      - open-vm-tools
      - qemu-guest-agent
      - spice-vdagent
      - WALinuxAgent
    state: absent
    cacheonly: true
    disablerepo: '*'
  when: ansible_facts.virtualization_role != "guest" or
        not guest_agent_enable | bool

- name: Remove unneeded packages on Azure/Hyper-V
  ansible.builtin.dnf:
    name:
      - open-vm-tools
      - qemu-guest-agent
      - spice-vdagent
    state: absent
    cacheonly: true
    disablerepo: '*'
  when:
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type == "VirtualPC"
    - guest_agent_enable | bool

- name: Remove unneeded packages on KVM
  ansible.builtin.dnf:
    name:
      - 'hyperv*'
      - open-vm-tools
      - WALinuxAgent
    state: absent
    cacheonly: true
    disablerepo: '*'
  when:
    - ansible_facts.system_vendor == "Nutanix"
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type == "kvm"
    - guest_agent_enable | bool

- name: Remove unneeded packages on Nutanix AHV
  ansible.builtin.dnf:
    name:
      - 'hyperv*'
      - qemu-guest-agent
      - open-vm-tools
      - spice-vdagent
      - WALinuxAgent
    state: absent
    cacheonly: true
    disablerepo: '*'
  when:
    - ansible_facts.system_vendor == "Nutanix"
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type == "kvm"
    - guest_agent_enable | bool

- name: Remove unneeded packages on VMware
  ansible.builtin.dnf:
    name:
      - 'hyperv*'
      - qemu-guest-agent
      - spice-vdagent
      - WALinuxAgent
    state: absent
    cacheonly: true
    disablerepo: '*'
  when:
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type == "VMware"
    - guest_agent_enable | bool

- name: Remove unneeded packages on other VMs
  ansible.builtin.dnf:
    name:
      - 'hyperv*'
      - open-vm-tools
      - qemu-guest-agent
      - spice-vdagent
      - WALinuxAgent
    state: absent
    cacheonly: true
    disablerepo: '*'
  when:
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type not in ['kvm', 'VirtualPC', 'VMware']
    - guest_agent_enable | bool

- name: Install virtual guest package
  vars:
    agent_packages:
      kvm: qemu-guest-agent
      VirtualPC:
        - hyperv-daemons
        - WALinuxAgent
      VMware: open-vm-tools
  ansible.builtin.dnf:
    name: "{{ agent_packages[ansible_facts.virtualization_type] }}"
    state: present
  when:
    - ansible_facts.system_vendor != "Nutanix"
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type in agent_packages
    - guest_agent_enable | bool

- name: Gather service facts
  ansible.builtin.service_facts:
  when:
    - ansible_facts.system_vendor != "Nutanix"
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type in ['kvm', 'VirtualPC', 'VMware']
    - guest_agent_enable | bool

- name: Enable virtual guest agent service
  vars:
    agent_services:
      kvm: qemu-guest-agent.service
      VirtualPC: waagent.service
      VMware: vmtoolsd.service
  ansible.builtin.service:
    name: "{{ agent_services[ansible_facts.virtualization_type] }}"
    enabled: true
  when:
    - ansible_facts.system_vendor != "Nutanix"
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type in agent_services
    - ansible_facts.virtualization_type in ['kvm', 'VirtualPC', 'VMware']
    - agent_services[ansible_facts.virtualization_type] in ansible_facts.services
    - guest_agent_enable | bool

- name: Start virtual guest agent service
  vars:
    agent_services:
      kvm: qemu-guest-agent.service
      VirtualPC: waagent.service
      VMware: vmtoolsd.service
  ansible.builtin.service:
    name: "{{ agent_services[ansible_facts.virtualization_type] }}"
    state: started
  when:
    - ansible_facts.system_vendor != "Nutanix"
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type in agent_services
    - ansible_facts.virtualization_type in ['kvm', 'VirtualPC', 'VMware']
    - agent_services[ansible_facts.virtualization_type] in ansible_facts.services
    - guest_agent_enable | bool

- name: Restrict QEMU guest agent RPCs
  when:
    - guest_agent_pci_dss | bool
    - ansible_facts.system_vendor != "Nutanix"
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type == "kvm"
    - guest_agent_enable | bool
  block:
    - name: Read QEMU guest agent settings
      ansible.builtin.slurp:
        src: /etc/sysconfig/qemu-ga
      register: guest_agent_qemu_ga
      # Not present yet in check mode before install
      failed_when: false

    - name: Find QEMU guest agent RPC filter
      vars:
        qga_lines: "{{ guest_agent_qemu_ga.content | b64decode | split('\n') }}"
        qga_pattern: '^(FILTER_RPC_ARGS="?--(allow|block)-rpcs=|BLACKLIST_RPC=|BLOCK_RPCS=)'
      ansible.builtin.set_fact:
        guest_agent_qemu_ga_filter_line: "{{ qga_lines | select('match', qga_pattern) | first | default('') }}"
      when: guest_agent_qemu_ga.content is defined

    - name: Verify QEMU guest agent RPC filter was found
      ansible.builtin.assert:
        that: guest_agent_qemu_ga_filter_line != ''
        quiet: true
        fail_msg: >-
          No RPC allow or block list found in /etc/sysconfig/qemu-ga,
          cannot apply PCI DSS RPC restrictions (2.2.4)
      when: guest_agent_qemu_ga.content is defined

    - name: Update QEMU guest agent RPC filter
      vars:
        qga_prefix: "{{ guest_agent_qemu_ga_filter_line | regex_replace('^([A-Z_]+=\"?(--[a-z]+-rpcs=)?).*$', '\\1') }}"
        qga_suffix: "{{ '\"' if '\"' in qga_prefix else '' }}"
        qga_rpcs: >-
          {{ guest_agent_qemu_ga_filter_line[qga_prefix | length:] | replace('"', '') | trim
             | split(',') | select | list }}
        qga_new_rpcs: >-
          {{ qga_rpcs | reject('in', guest_agent_pci_dss_qemu_blocked_rpcs) | list
             if '--allow-rpcs=' in qga_prefix else
             qga_rpcs + (guest_agent_pci_dss_qemu_blocked_rpcs | reject('in', qga_rpcs) | list) }}
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/qemu-ga
        regexp: "^{{ qga_prefix | regex_escape }}"
        line: "{{ qga_prefix }}{{ qga_new_rpcs | join(',') }}{{ qga_suffix }}"
      register: guest_agent_qemu_ga_filter
      when: guest_agent_qemu_ga.content is defined

    - name: Restart QEMU guest agent service
      ansible.builtin.service:
        name: qemu-guest-agent.service
        state: restarted
      when:
        - guest_agent_qemu_ga_filter is changed
        - ansible_facts.services['qemu-guest-agent.service'].state | default('') == 'running'

- name: Restrict VMware guest operations
  when:
    - guest_agent_pci_dss | bool
    - ansible_facts.virtualization_role == "guest"
    - ansible_facts.virtualization_type == "VMware"
    - guest_agent_enable | bool
  block:
    - name: Disable VMware guest operations
      community.general.ini_file:
        path: /etc/vmware-tools/tools.conf
        section: guestoperations
        option: disabled
        value: 'true'
        create: true
        mode: '0644'
      register: guest_agent_vmtools_conf

    - name: Restart VMware guest agent service
      ansible.builtin.service:
        name: vmtoolsd.service
        state: restarted
      when:
        - guest_agent_vmtools_conf is changed
        - ansible_facts.services['vmtoolsd.service'].state | default('') == 'running'
