---
- name: Verify SELinux booleans against PCI DSS
  vars:
    pci_justified: "{{ sebooleans_pci_dss_exceptions | default({}, true) | dict2items
                       | selectattr('value', 'string') | rejectattr('value', 'match', '^\\s*$')
                       | map(attribute='key') | list }}"
    pci_denied: "{{ sebooleans_enable | default([], true) | select
                    | intersect(sebooleans_pci_dss_denied | default([], true))
                    | difference(pci_justified) }}"
  ansible.builtin.assert:
    that: pci_denied | length == 0
    quiet: true
    fail_msg: >-
      PCI DSS violation - SELinux booleans weakening protections
      enabled without documented justification in
      sebooleans_pci_dss_exceptions (2.2.4/2.2.5/2.2.6): {{ pci_denied }}
  when: sebooleans_pci_dss | bool

- name: Install required packages
  vars:
    required_packages:
      - "{{ 'libselinux-utils' if sebooleans_skip_missing | bool else '' }}"
      - python3-libselinux
      - python3-libsemanage
  ansible.builtin.dnf:
    name: "{{ required_packages | select }}"
    state: present
  when: sebooleans_disable | select | length > 0 or
        sebooleans_enable | select | length > 0

- name: Get list of known SELinux booleans
  check_mode: false
  ansible.builtin.command: getsebool -a
  register: sebooleans_known
  changed_when: false
  when: sebooleans_disable | select | length > 0 or
        sebooleans_enable | select | length > 0

- name: Disable SELinux booleans
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: false
    persistent: true
    ignore_selinux_state: true
  loop: "{{ sebooleans_disable | select }}"
  when:
    - item + ' ' in sebooleans_known.stdout or
      not sebooleans_skip_missing | bool or
      sebooleans_pci_dss | bool
    - item not in sebooleans_enable | select

- name: Enable SELinux booleans
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
    ignore_selinux_state: true
  loop: "{{ sebooleans_enable | select }}"
  when:
    - item + ' ' in sebooleans_known.stdout or
      not sebooleans_skip_missing | bool or
      sebooleans_pci_dss | bool
