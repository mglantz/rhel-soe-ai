---
# List of directories, files and symlinks
# to create. Files will be created empty,
# permissions on targets will be updated.
# Uses ansible.builtin.file module
# Registers variables:
# create_directories, create_files, create_links
files_create:
#  - state: directory
#    path: /opt/dir
#    owner: root
#    group: root
#    mode: '0755'
#  - state: file
#    path: /opt/dir/file
#    owner: root
#    group: root
#    mode: '0644'
#  - state: link
#    src: /opt/dir/file
#    path: /opt/dir/link
#    force: true

# PCI DSS 4.0.1 guardrails, see docs/POLICY.md and
# docs/PCI-DSS-v4_0_1.md. Enable only for in-scope systems.
# When true, the role fails before making any change if an
# entry in files_create would:
#  - create or change a path under files_create_pci_dss_log_paths,
#    altering audit logs or their permissions (10.3.2)
#  - set a world-writable mode (2.2.6, 10.3.2); directories
#    with the sticky bit set (e.g. '1777') are allowed
files_create_pci_dss: false
files_create_pci_dss_log_paths:
  - /var/log
  - /run/log
