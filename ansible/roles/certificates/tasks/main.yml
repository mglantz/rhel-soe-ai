---
- name: Gather needed facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution_major_version
  when: ansible_facts.distribution_major_version is not defined

- name: Verify certificate configuration against PCI DSS
  ansible.builtin.assert:
    that:
      - certificates_exclusive | bool
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      certificates_exclusive enabled, so only declared
      anchors are trusted (4.2.1): {{ certificates_exclusive | bool }}
  when: certificates_pci_dss | bool

- name: Copy certificate anchor files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/pki/ca-trust/source/anchors/{{ item | basename }}
    mode: '0644'
  register: anchor_files
  loop: "{{ certificates_files_anchors | select }}"

- name: Copy certificate blocklist files
  vars:
    block_dir: "{{ 'blocklist' if ansible_facts.distribution_major_version | int >= 9 else 'blacklist' }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/pki/ca-trust/source/{{ block_dir }}/{{ item | basename }}
    mode: '0644'
  register: blocklist_files
  loop: "{{ certificates_files_blocklist | select }}"

- name: Copy certificate extended format files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/pki/ca-trust/source/{{ item | basename }}
    mode: '0644'
  register: ext_files
  loop: "{{ certificates_files_ext_format | select }}"

- name: Remove unrecognized certificate files
  vars:
    block_dir: "{{ 'blocklist' if ansible_facts.distribution_major_version | int >= 9 else 'blacklist' }}"
    system_files:
      - /etc/pki/ca-trust/source/README
      - /etc/pki/ca-trust/source/anchors
      - /etc/pki/ca-trust/source/{{ block_dir }}
      - /etc/pki/ca-trust/source/ca-bundle.legacy.crt
    files_remove:
      - /etc/pki/ca-trust/source/anchors/*
      - /etc/pki/ca-trust/source/{{ block_dir }}/*
      - /etc/pki/ca-trust/source/*
    files_remove_exclude: "{{ system_files | list +
                              certificates_files_known | select | list +
                              anchor_files.results | default([], true) | map(attribute='invocation.module_args.dest') | list +
                              blocklist_files.results | default([], true) | map(attribute='invocation.module_args.dest') | list +
                              ext_files.results | default([], true) | map(attribute='invocation.module_args.dest') | list }}"
  ansible.builtin.include_role:
    name: files_remove
  when: certificates_exclusive | bool

- name: Write extracted certificate configuration files
  ansible.builtin.command: update-ca-trust extract
  changed_when: true
  when: (anchor_files is changed or blocklist_files is changed or ext_files is changed) or
        (certificates_exclusive | bool and remove_files is changed)

- name: Inventory local trusted certificates
  ansible.builtin.shell:
    cmd: |
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      for f in /etc/pki/ca-trust/source/anchors/* /etc/pki/ca-trust/source/*; do
        [ -f "$f" ] || continue
        case $f in */source/README|*/source/ca-bundle.legacy.crt) continue ;; esac
        rm -f "$tmp"/c*
        awk -v d="$tmp" '/^-----BEGIN (TRUSTED )?CERTIFICATE-----/ { n++ }
                         n { print > (d "/c" n) }' "$f"
        [ -e "$tmp/c1" ] || openssl x509 -inform DER -in "$f" -out "$tmp/c1" 2> /dev/null || rm -f "$tmp/c1"
        [ -e "$tmp/c1" ] || { printf '%s|-|-|-|unparsed\n' "$f"; continue; }
        for c in "$tmp"/c*; do
          subject=$(openssl x509 -in "$c" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')
          issuer=$(openssl x509 -in "$c" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')
          enddate=$(openssl x509 -in "$c" -noout -enddate | sed 's/^notAfter=//')
          if openssl x509 -in "$c" -noout -checkend 0 > /dev/null; then state=valid; else state=EXPIRED; fi
          printf '%s|%s|%s|%s|%s\n' "$f" "$subject" "$issuer" "$enddate" "$state"
        done
      done
  register: certificates_inventory
  changed_when: false
  check_mode: false
  when: certificates_pci_dss | bool

- name: Display local trusted certificate inventory
  ansible.builtin.debug:
    msg: "{{ certificates_inventory.stdout_lines | default(['no local trusted certificates'], true) }}"
  when: certificates_pci_dss | bool

- name: Verify local trusted certificates have not expired
  vars:
    pci_expired: "{{ certificates_inventory.stdout_lines | select('search', '\\|EXPIRED$') | list }}"
  ansible.builtin.assert:
    that:
      - pci_expired | length == 0
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      expired trusted certificates (4.2.1): {{ pci_expired }}
  when: certificates_pci_dss | bool
