---
- name: Verify cron configuration against PCI DSS
  vars:
    pci_allowed: "{{ ['root'] + (cron_setup_allow_file | default([], true) | select | list) }}"
    pci_unallowed: "{{ (cron_setup_entries | default([], true)
                        | rejectattr('state', 'defined')
                        + (cron_setup_entries | default([], true)
                           | selectattr('state', 'defined')
                           | selectattr('state', 'equalto', 'present')))
                       | rejectattr('cron_file', 'defined')
                       | selectattr('user', 'defined')
                       | rejectattr('user', 'in', pci_allowed)
                       | map(attribute='user') | unique | list }}"
  ansible.builtin.assert:
    that:
      - cron_setup_allow_file is not none
      - pci_unallowed | length == 0
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      cron.allow managed, so cron is deny all by default
      (7.2.1, 7.3.3): {{ cron_setup_allow_file is not none }};
      cron_setup_entries users not in cron_setup_allow_file
      (7.2.2): {{ pci_unallowed }}
  when: cron_setup_pci_dss | bool

- name: Install cronie package
  ansible.builtin.dnf:
    name: cronie
    state: present

- name: Gather package facts
  ansible.builtin.package_facts:

- name: Enable crond service
  ansible.builtin.service:
    name: crond
    enabled: true
  when: "'cronie' in ansible_facts.packages"

- name: Start crond service
  ansible.builtin.service:
    name: crond
    state: started
  register: service_start
  when: "'cronie' in ansible_facts.packages"

- name: Remove cron.allow file
  ansible.builtin.file:
    path: /etc/cron.allow
    state: absent
  when: cron_setup_allow_file is none

- name: Create cron.allow file
  ansible.builtin.copy:
    content: "{{ (cron_setup_allow_file | select | join('\n') + '\n') if cron_setup_allow_file else '' }}"
    dest: /etc/cron.allow
    mode: '0600'
  when: cron_setup_allow_file is not none

- name: Remove cron.deny file
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
  when: cron_setup_deny_file is none

- name: Create cron.deny file
  ansible.builtin.copy:
    content: "{{ (cron_setup_deny_file | select | join('\n') + '\n') if cron_setup_deny_file else '' }}"
    dest: /etc/cron.deny
    mode: '0600'
  when: cron_setup_deny_file is not none

- name: Configure crontab entries - disabled
  vars:
    enabled_names: "{{ (cron_setup_entries
                        | selectattr('state', 'undefined')
                        + (cron_setup_entries
                           | selectattr('state', 'defined')
                           | selectattr('state', 'equalto', 'present')))
                       | map(attribute='name') }}"
    label_user: "{{ item.user + ': ' if item.user is defined else 'root: ' }}"
  ansible.builtin.cron:
    cron_file: "{{ item.cron_file | default(omit) }}"
    state: absent
    user: "{{ item.user | default(omit) }}"
    name: "{{ item.name }}"
    env: "{{ item.env | default(omit) }}"
    job: "{{ item.job | default(omit) }}"
    backup: "{{ item.backup | default(omit) }}"
  loop: "{{ cron_setup_entries
            | selectattr('state', 'defined')
            | selectattr('state', 'equalto', 'absent') }}"
  loop_control:
    label: "{{ label_user + item.name }}"
  when:
    - "'cronie' in ansible_facts.packages"
    - item.name not in enabled_names

- name: Configure crontab entries - enabled
  vars:
    label_user: "{{ item.user + ': ' if item.user is defined else 'root: ' }}"
  ansible.builtin.cron:
    cron_file: "{{ item.cron_file | default(omit) }}"
    state: present
    user: "{{ item.user | default(omit) }}"
    name: "{{ item.name }}"
    minute: "{{ item.minute | default(omit) }}"
    hour: "{{ item.hour | default(omit) }}"
    day: "{{ item.day | default(omit) }}"
    month: "{{ item.month | default(omit) }}"
    weekday: "{{ item.weekday | default(omit) }}"
    special_time: "{{ item.special_time | default(omit) }}"
    env: "{{ item.env | default(omit) }}"
    job: "{{ item.job | default(omit) }}"
    insertbefore: "{{ item.insertbefore | default(omit) }}"
    insertafter: "{{ item.insertafter | default(omit) }}"
    disabled: "{{ item.disabled | default(omit) }}"
    backup: "{{ item.backup | default(omit) }}"
  loop: "{{ cron_setup_entries
            | selectattr('state', 'undefined')
            + (cron_setup_entries
               | selectattr('state', 'defined')
               | selectattr('state', 'equalto', 'present')) }}"
  loop_control:
    label: "{{ label_user + item.name }}"
  when: "'cronie' in ansible_facts.packages"

- name: Restrict cron configuration file permissions
  ansible.builtin.file:
    path: /etc/crontab
    owner: root
    group: root
    mode: '0600'
  when:
    - cron_setup_pci_dss | bool
    - "'cronie' in ansible_facts.packages"

- name: Restrict cron configuration directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/cron.d
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
  when:
    - cron_setup_pci_dss | bool
    - "'cronie' in ansible_facts.packages"

- name: Find user crontabs and cron.d files
  ansible.builtin.find:
    paths:
      - /var/spool/cron
      - /etc/cron.d
    file_type: file
  register: cron_setup_pci_files
  check_mode: false
  when: cron_setup_pci_dss | bool

- name: Display user crontabs and cron.d files
  ansible.builtin.debug:
    msg: "{{ cron_setup_pci_files.files | map(attribute='path') | sort
             | default(['no user crontabs or cron.d files'], true) }}"
  when: cron_setup_pci_dss | bool

- name: Verify only allowed users have crontabs
  vars:
    pci_allowed: "{{ ['root'] + (cron_setup_allow_file | default([], true) | select | list) }}"
    pci_unallowed: "{{ cron_setup_pci_files.files | map(attribute='path')
                       | select('match', '/var/spool/cron/')
                       | map('basename')
                       | reject('in', pci_allowed) | list }}"
  ansible.builtin.assert:
    that:
      - pci_unallowed | length == 0
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      users with a crontab who are not in cron_setup_allow_file
      (7.2.2, 7.2.4): {{ pci_unallowed }}
  when: cron_setup_pci_dss | bool
