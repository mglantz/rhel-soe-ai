---
- name: Verify archives against PCI DSS
  vars:
    pci_files: "{{ files_unarchive | default([], true) | select | list }}"
    pci_regex: "^({{ files_unarchive_pci_dss_log_paths | map('regex_escape') | join('|') }})(/|$)"
    pci_log: "{{ pci_files | selectattr('dest', 'defined') | selectattr('dest', 'match', pci_regex)
                 | map(attribute='dest') | unique | list }}"
    pci_world: >-
      {%- set out = [] -%}
      {%- for f in pci_files if f.mode is defined -%}
      {%-   set m = ('%o' | format(f.mode)) if f.mode is number else (f.mode | string) -%}
      {%-   set ns = namespace(ww=false) -%}
      {%-   if m is match('^[0-7]+$') -%}
      {%-     set ns.ww = m[-1] in '2367' -%}
      {%-   else -%}
      {%-     for c in m.split(',') if c is match('^[ugoa]*[+=]') -%}
      {%-       set who = c | regex_replace('[+=].*$', '') -%}
      {%-       if (who == '' or 'o' in who or 'a' in who) and 'w' in (c | regex_replace('^[ugoa]*[+=]', '')) -%}
      {%-         set ns.ww = true -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%-   if ns.ww -%}{%- set _ = out.append(f.src ~ ' -> ' ~ f.dest) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | unique | list }}
    pci_nocert: >-
      {%- set out = [] -%}
      {%- for f in pci_files if f.validate_certs is defined -%}
      {%-   if not (f.validate_certs | bool) -%}{%- set _ = out.append(f.src) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | unique | list }}
  ansible.builtin.assert:
    that:
      - pci_log | length == 0
      - pci_world | length == 0
      - pci_nocert | length == 0
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      archive extracted to audit log path (10.3.2): {{ pci_log }};
      world-writable mode (2.2.6, 10.3.2): {{ pci_world }};
      certificate validation disabled (4.2.1): {{ pci_nocert }}
  when: files_unarchive_pci_dss | bool

- name: Install required packages
  vars:
    base_pkgs: "{{ ['gzip', 'tar', 'xz'] }}"
    attrs_used: "{{ true if files_unarchive | selectattr('attributes', 'defined') | length > 0 else false }}"
    attr_pkgs: "{{ ['e2fsprogs'] if attrs_used else [] }}"
    bzip2_used: "{{ true if files_unarchive | selectattr('src', 'search', '\\.bz2$') | length > 0 else false }}"
    bzip2_pkgs: "{{ ['bzip2'] if bzip2_used else [] }}"
    zip_used: "{{ true if files_unarchive | selectattr('src', 'search', '\\.zip$') | length > 0 else false }}"
    zip_pkgs: "{{ ['zip', 'unzip'] if zip_used else [] }}"
    zstd_used: "{{ true if files_unarchive | selectattr('src', 'search', '\\.zst$') | length > 0 else false }}"
    zstd_pkgs: "{{ ['zstd'] if zstd_used else [] }}"
    required_pkgs: "{{ base_pkgs + attr_pkgs + bzip2_pkgs + zip_pkgs + zstd_pkgs }}"
  ansible.builtin.dnf:
    name: "{{ required_pkgs }}"
    state: present
  when: files_unarchive | select | length > 0

- name: Unarchive files
  ansible.builtin.unarchive:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    creates: "{{ item.creates | default(omit) }}"
    remote_src: "{{ item.remote_src | default(omit) }}"
    validate_certs: "{{ item.validate_certs | default(omit) }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
    attributes: "{{ item.attributes | default(omit) }}"
    decrypt: "{{ item.decrypt | default(omit) }}"
    exclude: "{{ item.exclude | default(omit) }}"
    include: "{{ item.include | default(omit) }}"
    keep_newer: "{{ item.keep_newer | default(omit) }}"
    list_files: "{{ item.list_files | default(omit) }}"
    extra_opts: "{{ item.extra_opts | default(omit) }}"
    selevel: "{{ item.selevel | default(omit) }}"
    serole: "{{ item.serole | default(omit) }}"
    setype: "{{ item.setype | default(omit) }}"
    seuser: "{{ item.seuser | default(omit) }}"
    unsafe_writes: "{{ item.unsafe_writes | default(omit) }}"
    io_buffer_size: "{{ item.io_buffer_size | default(omit) }}"
  register: unarchive_files
  loop: "{{ files_unarchive | select }}"
  loop_control:
    label: "{{ item.src + ' -> ' + item.dest }}"
