---
# List of files and directories to copy
# Uses ansible.builtin.copy module
# Registers variable: copy_files
files_copy:
#  - src: /local/path/test.file
#    dest: /tmp/test.file
#    mode: '0600'

# List of templates to render
# Uses ansible.builtin.template module
# Registers variable: copy_templates
files_copy_templates:
#  - src: settings.conf.j2
#    dest: /etc/settings.conf
#    mode: '0644'

# PCI DSS 4.0.1 guardrails, see docs/POLICY.md and
# docs/PCI-DSS-v4_0_1.md. Enable only for in-scope systems.
# When true, the role fails before making any change if an
# entry in files_copy or files_copy_templates would:
#  - write to a path under files_copy_pci_dss_log_paths,
#    overwriting audit logs (10.3.2)
#  - set a world-writable mode (2.2.6, 10.3.2)
files_copy_pci_dss: false
files_copy_pci_dss_log_paths:
  - /var/log
  - /run/log
