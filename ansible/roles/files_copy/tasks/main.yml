---
- name: Verify files against PCI DSS
  vars:
    pci_files: "{{ (files_copy | default([], true) | select | list)
                   + (files_copy_templates | default([], true) | select | list) }}"
    pci_regex: "^({{ files_copy_pci_dss_log_paths | map('regex_escape') | join('|') }})(/|$)"
    pci_log: "{{ pci_files | selectattr('dest', 'defined') | selectattr('dest', 'match', pci_regex)
                 | map(attribute='dest') | unique | list }}"
    pci_world: >-
      {%- set out = [] -%}
      {%- for f in pci_files if f.mode is defined -%}
      {%-   set m = ('%o' | format(f.mode)) if f.mode is number else (f.mode | string) -%}
      {%-   set ns = namespace(ww=false) -%}
      {%-   if m is match('^[0-7]+$') -%}
      {%-     set ns.ww = m[-1] in '2367' -%}
      {%-   else -%}
      {%-     for c in m.split(',') if c is match('^[ugoa]*[+=]') -%}
      {%-       set who = c | regex_replace('[+=].*$', '') -%}
      {%-       if (who == '' or 'o' in who or 'a' in who) and 'w' in (c | regex_replace('^[ugoa]*[+=]', '')) -%}
      {%-         set ns.ww = true -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%-   if ns.ww -%}{%- set _ = out.append(f.dest | default(f.src | default('?'))) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | unique | list }}
  ansible.builtin.assert:
    that:
      - pci_log | length == 0
      - pci_world | length == 0
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      file written to audit log path (10.3.2): {{ pci_log }};
      world-writable mode (2.2.6, 10.3.2): {{ pci_world }}
  when: files_copy_pci_dss | bool

- name: Copy files
  ansible.builtin.copy:
    src: "{{ item.src | default(omit) }}"
    content: "{{ item.content | default(omit) }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
    attributes: "{{ item.attributes | default(omit) }}"
    backup: "{{ item.backup | default(omit) }}"
    checksum: "{{ item.checksum | default(omit) }}"
    decrypt: "{{ item.decrypt | default(omit) }}"
    directory_mode: "{{ item.directory_mode | default(omit) }}"
    force: "{{ item.force | default(omit) }}"
    local_follow: "{{ item.local_follow | default(omit) }}"
    selevel: "{{ item.selevel | default(omit) }}"
    serole: "{{ item.serole | default(omit) }}"
    setype: "{{ item.setype | default(omit) }}"
    seuser: "{{ item.seuser | default(omit) }}"
    unsafe_writes: "{{ item.unsafe_writes | default(omit) }}"
    follow: "{{ item.follow | default(omit) }}"
    validate: "{{ item.validate | default(omit) }}"
    remote_src: "{{ item.remote_src | default(omit) }}"
  register: copy_files
  loop: "{{ files_copy | select }}"
  loop_control:
    label: "{{ item.src | default('(inline content)') + ' -> ' + item.dest }}"

- name: Create files from templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
    follow: "{{ item.follow | default(omit) }}"
    validate: "{{ item.validate | default(omit) }}"
    attributes: "{{ item.attributes | default(omit) }}"
    backup: "{{ item.backup | default(omit) }}"
    block_end_string: "{{ item.block_end_string | default(omit) }}"
    block_start_string: "{{ item.block_start_string | default(omit) }}"
    comment_end_string: "{{ item.comment_end_string | default(omit) }}"
    comment_start_string: "{{ item.comment_start_string | default(omit) }}"
    variable_end_string: "{{ item.variable_end_string | default(omit) }}"
    variable_start_string: "{{ item.variable_start_string | default(omit) }}"
    unsafe_writes: "{{ item.unsafe_writes | default(omit) }}"
    trim_blocks: "{{ item.trim_blocks | default(omit) }}"
    output_encoding: "{{ item.output_encoding | default(omit) }}"
    newline_sequence: "{{ item.newline_sequence | default(omit) }}"
    lstrip_blocks: "{{ item.lstrip_blocks | default(omit) }}"
    force: "{{ item.force | default(omit) }}"
    selevel: "{{ item.selevel | default(omit) }}"
    serole: "{{ item.serole | default(omit) }}"
    setype: "{{ item.setype | default(omit) }}"
    seuser: "{{ item.seuser | default(omit) }}"
  register: copy_templates
  loop: "{{ files_copy_templates | select }}"
  loop_control:
    label: "{{ item.src + ' -> ' + item.dest }}"
