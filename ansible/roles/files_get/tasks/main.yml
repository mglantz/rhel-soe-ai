---
- name: Verify downloads against PCI DSS
  vars:
    pci_files: "{{ files_get | default([], true) | select | list }}"
    pci_nocert: >-
      {%- set out = [] -%}
      {%- for f in pci_files if f.validate_certs is defined -%}
      {%-   if not (f.validate_certs | bool) -%}{%- set _ = out.append(f.url) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | unique | list }}
    pci_cleartext: >-
      {%- set out = [] -%}
      {%- for f in pci_files if f.url_username is defined or f.url_password is defined -%}
      {%-   if not (f.url | string | lower).startswith('https://') -%}{%- set _ = out.append(f.url) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | unique | list }}
    pci_logged: "{{ pci_files | selectattr('url_password', 'defined') | list | length > 0 and not files_get_no_log | bool }}"
  ansible.builtin.assert:
    that:
      - pci_nocert | length == 0
      - pci_cleartext | length == 0
      - not pci_logged
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      certificate validation disabled (4.2.1): {{ pci_nocert }};
      credentials sent without TLS (8.3.2): {{ pci_cleartext }};
      credentials logged, files_get_no_log is false (8.3.2): {{ pci_logged }}
  when: files_get_pci_dss | bool

- name: Get files
  vars:
    passwords_used: "{{ files_get | selectattr('url_password', 'defined') | length > 0 }}"
  no_log: "{{ passwords_used and files_get_no_log }}"
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    url_username: "{{ item.url_username | default(omit) }}"
    url_password: "{{ item.url_password | default(omit) }}"
    validate_certs: "{{ item.validate_certs | default(omit) }}"
    force_basic_auth: "{{ item.force_basic_auth | default(omit) }}"
    http_agent: "{{ item.http_agent | default(omit) }}"
    use_gssapi: "{{ item.use_gssapi | default(omit) }}"
    use_netrc: "{{ item.use_netrc | default(omit) }}"
    use_proxy: "{{ item.use_proxy | default(omit) }}"
    timeout: "{{ item.timeout | default(omit) }}"
    headers: "{{ item.headers | default(omit) }}"
    decompress: "{{ item.decompress | default(omit) }}"
    unredirected_headers: "{{ item.unredirected_headers | default(omit) }}"
    client_cert: "{{ item.client_cert | default(omit) }}"
    client_key: "{{ item.client_key | default(omit) }}"
    ciphers: "{{ item.ciphers | default(omit) }}"
    tmp_dest: "{{ item.tmp_dest | default(omit) }}"
    dest: "{{ item.dest }}"
    force: "{{ item.force | default(omit) }}"
    backup: "{{ item.backup | default(omit) }}"
    checksum: "{{ item.checksum | default(omit) }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
    attributes: "{{ item.attributes | default(omit) }}"
    selevel: "{{ item.selevel | default(omit) }}"
    serole: "{{ item.serole | default(omit) }}"
    setype: "{{ item.setype | default(omit) }}"
    seuser: "{{ item.seuser | default(omit) }}"
    unsafe_writes: "{{ unsafe_writes.dest }}"
  register: get_files
  loop: "{{ files_get | select }}"
  loop_control:
    label: "{{ item.dest }}"
