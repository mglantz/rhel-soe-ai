---
- name: Verify AD domain join settings against PCI DSS
  vars:
    pci_attempts: "{{ domain_ad_pci_dss_offline_failed_login_attempts | int }}"
    pci_delay: "{{ domain_ad_pci_dss_offline_failed_login_delay | int }}"
  ansible.builtin.assert:
    that:
      - domain_ad_sssd_config_file | default('', true) | length > 0 or
        domain_ad_allow_groups | default([], true) | select | list | length > 0
      - "'without-nullok' in (domain_ad_auth_select_parameters | default('', true)).split()"
      - pci_attempts | int >= 1
      - pci_attempts | int <= 10
      - pci_delay | int == 0 or pci_delay | int >= 30
    quiet: true
    fail_msg: >-
      PCI DSS violations -
      domain_ad_allow_groups must restrict AD logins (7.2.1/7.2.2);
      domain_ad_auth_select_parameters must include without-nullok (8.3.1);
      domain_ad_pci_dss_offline_failed_login_attempts must be 1-10 and
      domain_ad_pci_dss_offline_failed_login_delay 0 or at least 30 (8.3.4)
  when:
    - domain_ad_pci_dss | bool
    - domain_ad_action == 'join'
    - domain_ad_domain is not none
    - domain_ad_domain | length > 0

- name: Prepare for AD domain operation
  ansible.builtin.include_tasks: prepare.yml
  when:
    - domain_ad_domain is not none
    - domain_ad_domain | length > 0

- name: Join AD domain
  ansible.builtin.include_tasks: join.yml
  when:
    - domain_ad_action == 'join'
    - domain_ad_domain is not none
    - domain_ad_domain | length > 0

- name: Leave AD domain
  ansible.builtin.include_tasks: leave.yml
  when:
    - domain_ad_action == 'leave'
    - domain_ad_domain is not none
    - domain_ad_domain | length > 0
