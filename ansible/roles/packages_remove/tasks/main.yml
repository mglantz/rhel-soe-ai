---
- name: Verify package removal against PCI DSS
  vars:
    pci_packages: "{{ packages_remove_pci_dss_packages | select
                      | difference(packages_remove_pci_dss_justified | select) }}"
    pci_kept: "{{ pci_packages | intersect((packages_install | default([], true) | select | list)
                                           + (packages_remove_exclude | select | list)) }}"
  ansible.builtin.assert:
    that: pci_kept | length == 0
    quiet: true
    fail_msg: >-
      PCI DSS violation - insecure packages kept via packages_install or
      packages_remove_exclude without being listed in
      packages_remove_pci_dss_justified (2.2.4/2.2.5/2.2.7): {{ pci_kept }}
  when: packages_remove_pci_dss | bool

- name: Remove unwanted packages
  vars:
    pci_packages: "{{ packages_remove_pci_dss_packages | select
                      | difference(packages_remove_pci_dss_justified | select)
                      if packages_remove_pci_dss | bool else [] }}"
    remove_packages: "{{ ((packages_remove | select | list) + pci_packages)
                         | difference(packages_install | select)
                         | difference(packages_remove_exclude | select) }}"
  ansible.builtin.dnf:
    name: "{{ remove_packages }}"
    state: absent
    exclude: "{{ packages_remove_exclude | select }}"
    autoremove: false
    cacheonly: true
    disablerepo: '*'
  register: removed_packages
  when: remove_packages | length > 0

- name: Remove unneeded leaf packages
  ansible.builtin.dnf:
    state: absent
    exclude: "{{ packages_remove_exclude | select }}"
    autoremove: true
    cacheonly: true
    disablerepo: '*'
  register: removed_packages_leaf
  when: packages_remove_autoremove | bool

- name: Display package changes
  ansible.builtin.include_tasks: display.yml
  when:
    - packages_remove_display_results | bool
    - removed_packages is changed or
      removed_packages_leaf is changed
